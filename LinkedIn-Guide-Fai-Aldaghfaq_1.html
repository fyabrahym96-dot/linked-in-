body{background-color:var(--navy);background-image:radial-gradient(60rem 30rem at 85% -6rem,var(--glowA),transparent 70%),radial-gradient(50rem 30rem at 0% 20rem,var(--glowB),transparent 70%),linear-gradient(var(--gold),var(--gold));background-size:auto,auto,100% 3px;background-repeat:no-repeat;background-position:0 0,0 0,0 0}

[hidden]{display:none!important}

en:[
{id:"what",t:"What is LinkedIn?",p:["LinkedIn is a social network for work. Instead of sharing personal photos, people share their education, jobs, skills and achievements. It has over a billion members worldwide, and many Saudi companies, hospitals, banks and government entities post jobs and search for candidates there.","Think of your profile as an online CV that is always open. Recruiters search LinkedIn by job title, skill, city and university, and if your profile uses the right words, they can find you even when you did not apply."]},
{id:"why",t:"Why should you have an account?",list:["Recruiters can find you for jobs you did not know existed","You can apply to thousands of jobs, many with one click (Easy Apply)","You build a network of classmates, teachers and professionals in your field","You learn from experts' posts and follow the companies you dream of joining","Your certificates and projects are visible in one place"]},
{id:"rules",t:"Rules before you start",list:["You must be at least 16 years old","Use your real name, the same as on your certificates","Everything on your profile must be true: real jobs, real studies, real certificates","One person, one account","Use a professional email, like firstname.lastname@gmail.com"],warn:"Never invent a company, job title or certificate. LinkedIn removes fake information, and employers check references. Being honest is what makes a profile trusted."},
{id:"create",t:"Create your account, step by step",steps:[["Download the app or go to linkedin.com","On the website, click Join now."],["Enter your email and a strong password","Use an email you will keep for years."],["Write your first and last name","Choose whether to write it in English, Arabic, or add both later."],["Add your location","Your city, for example Riyadh, so local recruiters find you."],["Add your current status","Your recent job title, or choose \"I'm a student\" and add your university."],["Verify your email","Open the code LinkedIn sends you and enter it."],["Add a profile photo","Profiles with photos get many more views."],["Skip or accept suggestions","LinkedIn will suggest people to connect with. You can do this later."]]},
{id:"build",t:"Build your profile in this order",steps:[["Photo and banner","A clear photo of your face. The banner can be a simple image related to your field."],["Headline","Up to 220 characters. Write your role, specialty, and a key skill. See the examples page."],["About","3 short paragraphs: who you are, what you are good at, what you want next."],["Experience","Jobs, internships, part-time work, volunteering. Use bullets with verbs and numbers."],["Education","University, degree, years, GPA if strong, graduation project."],["Licenses and certifications","Professional licenses and online certificates, with the issuer and date."],["Skills","Add 5 to 10 and pin the top 3."],["Custom URL","In Edit public profile, change your link to linkedin.com/in/your-name."],["Open to Work","Tell recruiters which roles you want. You can make it visible only to recruiters."]]},
{id:"how",t:"How LinkedIn works",defs:[["Connections","People you are linked with. 1st degree are direct connections, 2nd degree are their connections, 3rd degree are one step further. More good connections means more people see you."],["Follow","You can follow a person or company to see their posts without connecting."],["Feed","The home page where you see posts from your network."],["Posts, reactions and comments","Share what you learned, a project, or a certificate. Thoughtful comments on others' posts also make you visible."],["Jobs","Search by title and city, save jobs, and turn on job alerts so LinkedIn emails you new jobs."],["Easy Apply","Apply with your LinkedIn profile in one click. Make sure your profile is complete first."],["Messaging","Send messages to your connections. Keep them short and polite."],["Endorsements and recommendations","Others can confirm your skills or write a recommendation about working with you."],["LinkedIn Learning","Video courses. Some are free, and completed courses can be added to your profile."]]},

ar:[
{id:"what",t:"ما هو لينكدإن؟",p:["لينكدإن شبكة تواصل اجتماعي للعمل والمهنة. بدلاً من مشاركة الصور الشخصية، يشارك الناس تعليمهم ووظائفهم ومهاراتهم وإنجازاتهم. يضم أكثر من مليار عضو حول العالم، وكثير من الشركات والمستشفيات والبنوك والجهات الحكومية في السعودية تنشر وظائفها وتبحث عن المرشحين فيه.","اعتبري حسابك سيرة ذاتية إلكترونية مفتوحة دائماً. مسؤولو التوظيف يبحثون في لينكدإن بالمسمى الوظيفي والمهارة والمدينة والجامعة، وإذا كان حسابك يحتوي الكلمات الصحيحة سيجدونك حتى لو لم تتقدمي."]},
{id:"why",t:"لماذا تحتاجين حساباً؟",list:["يجدك مسؤولو التوظيف لوظائف لم تكوني تعرفين عنها","تتقدمين لآلاف الوظائف، وكثير منها بضغطة واحدة (التقديم السهل)","تبنين شبكة من زميلاتك وأساتذتك والمختصين في مجالك","تتعلمين من منشورات الخبراء وتتابعين الشركات التي تحلمين بالعمل فيها","تظهر شهاداتك ومشاريعك في مكان واحد"]},
{id:"rules",t:"قواعد قبل البدء",list:["يجب ألا يقل عمرك عن 16 سنة","استخدمي اسمك الحقيقي كما في شهاداتك","كل ما في حسابك يجب أن يكون صحيحاً: وظائف حقيقية، دراسة حقيقية، شهادات حقيقية","لكل شخص حساب واحد فقط","استخدمي بريداً إلكترونياً مهنياً مثل firstname.lastname@gmail.com"],warn:"لا تخترعي أبداً شركة أو مسمى وظيفياً أو شهادة. لينكدإن يحذف المعلومات المزيفة، وأصحاب العمل يتحققون من المراجع. الصدق هو ما يجعل الحساب موثوقاً."},
{id:"create",t:"إنشاء الحساب خطوة بخطوة",steps:[["حمّلي التطبيق أو ادخلي موقع linkedin.com","في الموقع اضغطي على Join now (انضم الآن)."],["اكتبي بريدك الإلكتروني وكلمة مرور قوية","استخدمي بريداً ستحتفظين به لسنوات."],["اكتبي اسمك الأول والأخير","اختاري كتابته بالإنجليزية أو العربية، ويمكنك إضافة اللغة الأخرى لاحقاً."],["أضيفي موقعك","مدينتك، مثل الرياض، حتى يجدك مسؤولو التوظيف في منطقتك."],["أضيفي وضعك الحالي","آخر مسمى وظيفي لك، أو اختاري \"أنا طالبة\" وأضيفي جامعتك."],["أكّدي بريدك الإلكتروني","افتحي الرمز الذي يرسله لينكدإن واكتبيه."],["أضيفي صورة شخصية","الحسابات التي فيها صورة تحصل على مشاهدات أكثر بكثير."],["تخطّي الاقتراحات أو اقبليها","سيقترح لينكدإن أشخاصاً للتواصل معهم، ويمكنك فعل ذلك لاحقاً."]]},
{id:"build",t:"ابني حسابك بهذا الترتيب",steps:[["الصورة والغلاف","صورة واضحة لوجهك. الغلاف يمكن أن يكون صورة بسيطة تتعلق بمجالك."],["العنوان (Headline)","حتى 220 حرفاً. اكتبي مسماك وتخصصك ومهارة أساسية. انظري صفحة الأمثلة."],["النبذة (About)","3 فقرات قصيرة: من أنتِ، بماذا تتميزين، وماذا تريدين بعد ذلك."],["الخبرات (Experience)","الوظائف، التدريب التعاوني، العمل الجزئي، التطوع. اكتبي نقاطاً تبدأ بفعل وفيها أرقام."],["التعليم (Education)","الجامعة، التخصص، السنوات، المعدل إن كان قوياً، ومشروع التخرج."],["الرخص والشهادات","الرخص المهنية والشهادات الإلكترونية مع الجهة المانحة والتاريخ."],["المهارات (Skills)","أضيفي من 5 إلى 10 مهارات وثبّتي أهم 3."],["الرابط المخصص","من Edit public profile غيّري رابطك إلى linkedin.com/in/your-name."],["متاحة للعمل (Open to Work)","أخبري مسؤولي التوظيف بالوظائف التي تريدينها، ويمكن جعلها ظاهرة لهم فقط."]]},
{id:"how",t:"كيف يعمل لينكدإن",defs:[["العلاقات (Connections)","الأشخاص المرتبطون بك. الدرجة الأولى تواصل مباشر، والثانية معارفهم، والثالثة أبعد بخطوة. كلما زادت علاقاتك الجيدة زاد عدد من يراك."],["المتابعة (Follow)","يمكنك متابعة شخص أو شركة لرؤية منشوراتهم دون إضافة."],["الصفحة الرئيسية (Feed)","حيث ترين منشورات شبكتك."],["المنشورات والتفاعل والتعليقات","شاركي ما تعلمتِه أو مشروعاً أو شهادة. التعليقات المفيدة على منشورات الآخرين تجعلك ظاهرة أيضاً."],["الوظائف (Jobs)","ابحثي بالمسمى والمدينة، واحفظي الوظائف، وفعّلي تنبيهات الوظائف ليرسل لك لينكدإن الجديد."],["التقديم السهل (Easy Apply)","تقدّمي بحسابك بضغطة واحدة. تأكدي أولاً أن حسابك مكتمل."],["الرسائل (Messaging)","أرسلي رسائل لعلاقاتك، واجعليها قصيرة ومهذبة."],["التأييدات والتوصيات","يمكن للآخرين تأكيد مهاراتك أو كتابة توصية عن العمل معك."],["لينكدإن للتعلم (LinkedIn Learning)","دورات بالفيديو، بعضها مجاني، ويمكن إضافة الدورات المكتملة إلى حسابك."]]},
{id:"plan",t:"خطتك في أول 30 يوماً",weeks:[["الأسبوع 1","أكملي كل أقسام حسابك مستعينة بالأمثلة."],["الأسبوع 2","تواصلي مع 30 إلى 50 شخصاً: زميلاتك، أساتذتك، معارف العائلة العاملين في مجالك."],["الأسبوع 3","تابعي 20 شركة تتمنين العمل فيها، وفعّلي تنبيهات الوظائف."],["الأسبوع 4","اكتبي أول منشور لك (دورة أنهيتِها أو مشروع) وتقدّمي لـ 5 وظائف."]]},
{id:"msg",t:"كيف ترسلين طلب تواصل",p:["أضيفي دائماً رسالة قصيرة عند التواصل مع شخص لا تعرفينه جيداً. مثال:"],box:"مرحباً أستاذة حصة،\nأنا طالبة هندسة مدنية في جامعة الملك عبدالعزيز، وأعجبني عملك في مشاريع البنية التحتية. يسعدني التواصل معك والتعلم من خبرتك.\nشكراً لك،\nسارة"},

try{lang=localStorage.getItem("lang")||"en"}catch(_){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);

function row(inner,note){const u=UI[lang];return `<div class="row${note?"":" nonote"}"><section class="card">${inner}</section>${note?`<aside class="note"><b>${u.why}</b>${esc(note)}</aside>`:""}</div>`}
const ico=n=>`<div class="logo" aria-hidden="true">${n}</div>`;

function renderProfile(){
  const u=UI[lang],S=u.s,p=cur[lang],n=p.notes,ini=cur.ini[lang==="ar"?1:0];
  const q=lang==="ar"?["«","»"]:["“","”"];
  let h=`<div class="row"><section class="card top"><div class="banner" style="background:${cur.color}"></div><div class="in">
    <div class="avatar" style="background:${cur.color}">${ini}</div>
    <p class="name">${esc(p.name)}</p><p class="headline">${esc(p.headline)}</p>
    <p class="meta">${esc(p.loc)} · ${esc(p.conn)}</p>${p.otw?`<span class="otw">${esc(p.otw)}</span>`:""}</div></section>
    <aside class="note"><b>${u.why}</b>${esc(n.top)}</aside></div>`;
  h+=row(`<h2>${S.about}</h2>${p.about.map(t=>`<p style="margin:0 0 8px">${esc(t)}</p>`).join("")}`,n.about);
  h+=row(`<h2>${S.featured}</h2><div class="feat">${p.featured.map(f=>`<div class="fbox"><p style="font-weight:600">${esc(f[0])}</p><p class="sub">${esc(f[1])}</p></div>`).join("")}</div>`,"");
  h+=row(`<h2>${S.exp}</h2>${p.exp.map(e=>`<div class="item">${ico("&#9638;")}<div style="min-width:0"><h3>${esc(e[0])}</h3><p>${esc(e[1])}</p><p class="sub">${esc(e[2])}</p><p class="sub">${esc(e[3])}</p><ul class="b">${e[4].map(b=>`<li>${esc(b)}</li>`).join("")}</ul></div></div>`).join("")}`,n.exp);
  h+=row(`<h2>${S.edu}</h2>${p.edu.map(e=>`<div class="item">${ico("&#9673;")}<div style="min-width:0"><h3>${esc(e[0])}</h3><p>${esc(e[1])}</p><p class="sub">${esc(e[2])}</p>${e[3]?`<p class="sub">${esc(e[3])}</p>`:""}</div></div>`).join("")}`,"");
  h+=row(`<h2>${S.certs}</h2>${p.certs.map(c=>`<div class="item">${ico("&#10003;")}<div style="min-width:0"><h3>${esc(c[0])}</h3><p>${esc(c[1])}</p><p class="sub">${esc(c[2])}</p></div></div>`).join("")}`,n.certs);
  h+=row(`<h2>${S.courses}</h2><ul class="b" style="margin:0">${p.courses.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>`,"");
  h+=row(`<h2>${S.skills}</h2><div class="tags">${p.skills.map(s=>`<span class="tag">${esc(s)}</span>`).join("")}</div>`,n.skills);
  h+=row(`<h2>${S.vol}</h2>${p.vol.map(v=>`<div class="item">${ico("&#9825;")}<div style="min-width:0"><h3>${esc(v[0])}</h3><p>${esc(v[1])}</p><p class="sub">${esc(v[2])}</p><p class="sub">${esc(v[3])}</p></div></div>`).join("")}`,"");
  let x=`<h2>${S.langs}</h2><div class="tags" style="margin-bottom:${p.honors.length?"16px":"0"}">${p.langs.map(l=>`<span class="tag">${esc(l)}</span>`).join("")}</div>`;
  if(p.honors.length)x+=`<h2>${S.honors}</h2><ul class="b" style="margin:0">${p.honors.map(y=>`<li>${esc(y)}</li>`).join("")}</ul>`;
  h+=row(x,"");
  h+=row(`<h2>${S.rec}</h2><p class="rec">${q[0]}${esc(p.rec[0])}${q[1]}</p><p class="sub" style="margin-top:6px">${esc(p.rec[1])}</p>`,"");

function renderGuide(){
  const u=UI[lang],secs=G[lang];
  let h=`<section class="card"><h2>${u.contents}</h2><nav class="toc">${secs.map(s=>`<a href="#g-${s.id}">${esc(s.t)}</a>`).join("")}</nav></section>`;
  secs.forEach(s=>{
    let b=`<h2 id="g-${s.id}">${esc(s.t)}</h2><div class="gsec">`;
    if(s.p)b+=s.p.map(t=>`<p>${esc(t)}</p>`).join("");
    if(s.list)b+=`<ul class="b" style="margin:0">${s.list.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`;
    if(s.p2)b+=`<p style="margin-top:10px">${esc(s.p2)}</p>`;
    if(s.warn)b+=`<div class="box warn">${esc(s.warn)}</div>`;
    if(s.box)b+=`<div class="box">${esc(s.box)}</div>`;
    if(s.steps)b+=s.steps.map((st,i)=>`<div class="step"><div class="num">${i+1}</div><div style="min-width:0"><h3>${esc(st[0])}</h3><p>${esc(st[1])}</p></div></div>`).join("");
    if(s.defs)b+=s.defs.map(d=>`<div class="item"><div style="min-width:0"><h3>${esc(d[0])}</h3><p class="sub" style="font-size:14px">${esc(d[1])}</p></div></div>`).join("");
    if(s.weeks)b+=`<div class="weeks">${s.weeks.map(w=>`<div class="wk"><b>${esc(w[0])}</b>${esc(w[1])}</div>`).join("")}</div>`;
    b+=`</div>`;
    if(s.id==="build")b+=`<button class="go" type="button" data-go="1" style="margin-top:14px">${u.goEx}</button>`;
    h+=`<section class="card">${b}</section>`;
  });
  h+=`<button class="go" type="button" data-go="1">${u.goEx}</button>`;
  $("guideView").innerHTML=h;
}

function renderAll(){
  const u=UI[lang];
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  $("vGuide").textContent=u.guide;$("vEx").textContent=u.ex;$("langBtn").textContent=u.lang;
  $("vGuide").setAttribute("aria-pressed",view==="guide");$("vEx").setAttribute("aria-pressed",view==="examples");
  $("h1").textContent=view==="guide"?u.h1g:u.h1e;$("lede").textContent=view==="guide"?u.ledeg:u.ledee;
  $("guideView").hidden=view!=="guide";$("exView").hidden=view!=="examples";$("chips").hidden=view!=="examples";
  $("toggleNotes").textContent=document.body.classList.contains("hide-notes")?u.show:u.hide;
  $("chips").innerHTML=P.map(p=>`<button class="chip" type="button" data-id="${p.id}" aria-pressed="false">${esc(p[lang].label)}</button>`).join("");
  $("ckH").textContent=u.ckH;$("ckL").innerHTML=u.ck.map(c=>`<li>${esc(c)}</li>`).join("");
  renderGuide();renderProfile();
}
function setHash(h){try{history.replaceState(null,"","#"+h)}catch(_){}}
function showExamples(){view="examples";setHash(cur.id);renderAll();window.scrollTo(0,0)}

$("views").addEventListener("click",e=>{const b=e.target.closest(".vbtn");if(!b)return;view=b.dataset.v;setHash(view==="guide"?"guide":cur.id);renderAll();window.scrollTo(0,0)});
$("langBtn").addEventListener("click",()=>{lang=lang==="en"?"ar":"en";try{localStorage.setItem("lang",lang)}catch(_){}renderAll()});
$("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;cur=P.find(x=>x.id===b.dataset.id);setHash(cur.id);renderProfile();
  const pr=$("profile"),ch=$("chips");pr.style.scrollMarginTop=(ch.offsetHeight+16)+"px";
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  pr.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});
  const act=ch.querySelector('.chip[aria-pressed="true"]');if(act&&ch.scrollWidth>ch.clientWidth)act.scrollIntoView({block:"nearest",inline:"center"});});
$("guideView").addEventListener("click",e=>{if(e.target.closest("[data-go]"))showExamples()});
$("toggleNotes").addEventListener("click",()=>{document.body.classList.toggle("hide-notes");renderAll()});

const h0=location.hash.slice(1),hp=P.find(p=>p.id===h0);
if(hp){cur=hp;view="examples"}
renderAll();
</script>

</body>
</html>
